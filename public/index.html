<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MỘNG PHƯỢNG HOÀNG · Phượng khởi thâm cung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --gold:#e2bf6b; --gold2:#f3dc96; --red:#8a1a17; --panel:rgba(48,20,20,.88); --line:#7a4a3a; --text:#f8ecdc; --muted:#cdb59c; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; overflow:hidden; background:#3a1c18; color:var(--text); font-family:'Be Vietnam Pro',system-ui,sans-serif; font-size:14px; }
#c { position:fixed; inset:0; width:100%; height:100%; display:block; }
#labels { position:fixed; inset:0; pointer-events:none; }
.hidden { display:none !important; }
button { font:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--line); background:rgba(90,30,26,.9); color:var(--text); padding:9px 12px; }
button:hover { border-color:var(--gold); }
button.gold { background:linear-gradient(#f0cf73,#c99a3c); color:#3a1408; border-color:#f3dc96; font-weight:600; }
button:disabled { opacity:.45; cursor:default; }
input, select { font:inherit; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:rgba(20,8,8,.6); color:var(--text); width:100%; }
.serif { font-family:'Noto Serif',serif; }

/* màn hình đăng nhập */
#gate { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:radial-gradient(ellipse at center, rgba(40,10,8,.25), rgba(30,8,6,.75)); z-index:20; }
#gate h1 { font-family:'Noto Serif',serif; font-weight:700; font-size:clamp(34px,6vw,64px); letter-spacing:.08em; margin:0; color:var(--gold2); text-shadow:0 2px 0 #6a3a10, 0 0 24px rgba(240,190,90,.55); text-align:center; }
#gate .sub { font-family:'Noto Serif',serif; font-size:clamp(16px,2.4vw,22px); color:var(--gold); margin:6px 0 4px; letter-spacing:.2em; }
#gate .tag { font-family:'Noto Serif',serif; font-style:italic; color:var(--gold); font-size:clamp(13px,1.8vw,17px); margin:10px 0 26px; text-align:center; padding:0 16px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; width:min(380px,92vw); box-shadow:0 10px 40px rgba(0,0,0,.4); }
.card h3 { margin:0 0 14px; font-family:'Noto Serif',serif; color:var(--gold2); font-weight:700; }
.card label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
.row { display:flex; gap:8px; }
.choices { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.choice { text-align:left; padding:10px; font-size:13px; }
.choice small { display:block; color:var(--muted); font-size:11.5px; margin-top:3px; line-height:1.35; }
.choice.on { border-color:var(--gold); background:rgba(160,90,30,.45); }
#err { color:#ffb4a0; font-size:13px; min-height:18px; margin-top:8px; }

/* giao diện trong game */
#hud { position:fixed; left:10px; top:10px; right:10px; display:flex; gap:10px; align-items:flex-start; pointer-events:none; z-index:5; }
#hud > * { pointer-events:auto; }
#top5 { position:fixed; left:10px; top:118px; width:250px; z-index:5; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:7px 10px 6px; font-size:12.5px; }
#top5 .t { font-family:'Noto Serif',serif; color:var(--gold2); font-weight:700; font-size:13px; margin-bottom:3px; cursor:pointer; user-select:none; }
#top5.min ol { display:none; }
#top5 ol { list-style:none; margin:0; padding:0; }
#top5 li { display:flex; align-items:center; gap:6px; padding:2.5px 0; border-top:1px solid rgba(255,255,255,.06); transition:background .6s; }
#top5 li.me { color:var(--gold2); font-weight:700; }
#top5 li.flash { background:rgba(243,210,122,.25); }
#top5 .no { width:16px; text-align:center; font-weight:700; color:var(--gold); }
#top5 li:nth-child(1) .no { color:#ffd76a; } 
#top5 .nm { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#top5 .rk { font-size:11px; color:var(--muted); white-space:nowrap; }
#top5 .tr { width:14px; text-align:center; font-weight:900; font-size:13px; }
#top5 .tr.up { color:#3fd46b; } #top5 .tr.down { color:#ff4d4d; }
#top5 .on { width:6px; height:6px; border-radius:50%; background:#555; flex:none; } #top5 .on.y { background:#3fd46b; }
body.staging #top5 { display:none !important; }
@media (max-width:760px) { #top5 { top:auto; bottom:250px; width:200px; } }
#who { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 14px; min-width:220px; }
#who .nm { font-family:'Noto Serif',serif; font-size:17px; color:var(--gold2); font-weight:700; }
#who .rk { color:var(--gold); font-size:13px; }
.bar { height:6px; background:rgba(0,0,0,.4); border-radius:3px; margin-top:6px; overflow:hidden; }
.bar > i { display:block; height:100%; background:linear-gradient(90deg,#c99a3c,#f3dc96); }
#stats { display:flex; gap:6px; flex-wrap:wrap; max-width:calc(100vw - 520px); }
.pill { background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:6px 11px; font-size:12.5px; white-space:nowrap; }
.pill b { color:var(--gold2); }
#map { position:fixed; left:10px; top:max(50%, 380px); transform:translateY(-50%); display:flex; flex-direction:column; gap:6px; z-index:5; }
#map button { text-align:left; min-width:140px; font-size:13px; }
#map button.on { border-color:var(--gold); background:rgba(160,90,30,.55); }
#acts { position:fixed; right:10px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:6px; z-index:5; max-width:220px; }
#acts .ttl { font-family:'Noto Serif',serif; color:var(--gold2); text-align:right; font-size:15px; margin-bottom:2px; text-shadow:0 1px 4px #000; }
#acts button { text-align:left; font-size:13px; }
#acts button small { display:block; color:var(--muted); font-size:11px; }
#chat { position:fixed; left:10px; bottom:10px; width:min(360px,60vw); z-index:5; }
#chatlog { max-height:150px; overflow-y:auto; font-size:13px; background:rgba(30,10,10,.55); border-radius:12px 12px 0 0; padding:8px 10px; }
#chatlog div { margin:2px 0; text-shadow:0 1px 2px #000; }
#chatlog b { color:var(--gold); font-weight:600; }
#chatin { border-radius:0 0 12px 12px; }
#newsbtn { position:fixed; right:10px; bottom:10px; z-index:5; }
#news { position:fixed; right:10px; bottom:56px; width:min(360px,80vw); max-height:50vh; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; z-index:6; }
#news h4 { margin:0 0 8px; font-family:'Noto Serif',serif; color:var(--gold2); }
#news .n { padding:7px 0; border-bottom:1px solid rgba(255,255,255,.07); font-size:13px; line-height:1.45; }
#news .n time { color:var(--muted); font-size:11px; display:block; }
#toasts { position:fixed; top:84px; left:50%; transform:translateX(-50%); z-index:30; display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none; }
.toast { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:9px 14px; max-width:min(520px,92vw); font-size:13.5px; animation:fade 5s forwards; text-align:center; }
.toast.good { border-color:#b9a04a; } .toast.bad { border-color:#c0503a; }
@keyframes fade { 0%{opacity:0;transform:translateY(-6px)} 6%{opacity:1;transform:none} 85%{opacity:1} 100%{opacity:0} }
.label { font-size:13px; font-weight:600; text-align:center; color:#fff; white-space:nowrap; transform:translateY(-6px); -webkit-text-stroke:3px rgba(35,8,4,.92); paint-order:stroke fill; letter-spacing:.01em; }
.label.npc { color:#f6dc92; font-size:12px; }
.label .r { display:inline-block; margin-top:3px; padding:1px 9px 2px; border-radius:999px; font-size:11.5px; font-weight:700; -webkit-text-stroke:0; letter-spacing:.03em; border:1px solid rgba(0,0,0,.25); box-shadow:0 1px 4px rgba(0,0,0,.45); }
.label .r.t0 { background:#f3e6c8; color:#5a2a10; }
.label .r.t1 { background:linear-gradient(#b8231d,#7d1210); color:#ffe39a; border-color:#e2bf6b; }
.label .r.t2 { background:linear-gradient(#ffe7a0,#d9a43a); color:#6a0f0c; border-color:#fff1c4; }
.label .r.t3 { background:linear-gradient(#fff3c0,#e6b23c 55%,#b67a14); color:#6a0f0c; border-color:#fff; box-shadow:0 0 10px rgba(255,210,110,.9), 0 1px 4px rgba(0,0,0,.5); }
.label .r.tx { background:#5b5552; color:#e8e2dc; }
.bubble { position:relative; background:#fffaf0; color:#2a0e05; -webkit-text-stroke:0; font-weight:500; border-radius:10px; padding:5px 10px; font-size:13.5px; line-height:1.35; max-width:220px; white-space:normal; margin-bottom:8px; box-shadow:0 2px 8px rgba(0,0,0,.35); }
.bubble::after { content:''; position:absolute; left:50%; bottom:-6px; margin-left:-6px; border:6px solid transparent; border-bottom:0; border-top-color:#fffaf0; }
.modal { position:fixed; inset:0; background:rgba(10,4,4,.55); display:flex; align-items:center; justify-content:center; z-index:15; }
.modal .card { width:min(640px,94vw); max-height:88vh; overflow-y:auto; }
.modal table { width:100%; border-collapse:collapse; font-size:13px; margin:8px 0; }
.modal th, .modal td { text-align:left; padding:6px; border-bottom:1px solid rgba(255,255,255,.08); }
.modal th { color:var(--gold); font-weight:600; }
.close { float:right; padding:4px 10px; }
.clue { background:rgba(0,0,0,.25); border-left:3px solid var(--gold); padding:6px 10px; margin:6px 0; border-radius:6px; font-size:13px; }
.btns { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
#cut { position:fixed; inset:0; z-index:25; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; pointer-events:none; }
#cut .scroll { pointer-events:auto; margin-bottom:3vh; width:min(560px,94vw); max-height:42vh; overflow-y:auto; background:linear-gradient(#f6e6bfee,#e8cf95ee); color:#4a1a08; border:2px solid #b8862d; border-radius:12px; padding:12px 18px; font-family:'Noto Serif',serif; font-size:14.5px; line-height:1.55; box-shadow:0 8px 30px rgba(0,0,0,.45); }
body.staging #cut { align-items:flex-end; padding-right:2vw; }
body.staging #cut .scroll { width:min(400px,92vw); font-size:13.5px; }
body.staging #map, body.staging #acts, body.staging #who, body.staging #stats, body.staging #chat, body.staging #newsbtn, body.staging #news, body.staging #labels, body.staging #musicbtn, body.staging #guidebtn { display:none !important; }
#guidebtn { position:fixed; right:128px; top:10px; z-index:6; background:var(--panel); color:var(--gold2); border:1px solid var(--line); border-radius:10px; padding:7px 12px; font-size:13px; cursor:pointer; }
#tour { position:fixed; inset:0; z-index:40; }
#tour .hole { position:fixed; border-radius:12px; box-shadow:0 0 0 9999px rgba(10,3,2,.68); outline:2px solid #f3d27a; outline-offset:2px; transition:all .35s ease; pointer-events:none; animation:tourGlow 1.6s ease-in-out infinite; }
@keyframes tourGlow { 50% { outline-color:#fff3c4; } }
#tour .tip { position:fixed; background:linear-gradient(#f8ead0,#ecd6a3); color:#3a1408; border:2px solid #b8862d; border-radius:12px; padding:12px 16px; box-shadow:0 10px 30px rgba(0,0,0,.5); font-size:14px; line-height:1.55; transition:left .35s, top .35s; }
#tour .tip h4 { margin:2px 0 4px; font-family:'Noto Serif',serif; color:#8a1a17; font-size:17px; }
#tour .tip .step { font-size:11px; color:#8a5a2a; letter-spacing:.08em; }
#tour .tip .btns { display:flex; justify-content:flex-end; gap:8px; margin-top:10px; }
#tour .tip .skip { background:transparent; border:1px solid #b8862d; color:#6a3a14; }
body.staging #cut.top, #cut.top { justify-content:flex-start; align-items:center; padding:2.5vh 0 0; }
body.staging #cut .scroll.edict, #cut .scroll.edict { width:min(880px,94vw); min-height:220px; max-height:none; overflow:visible; box-sizing:border-box; padding:46px 74px 40px; border:0; border-radius:0; box-shadow:none; text-align:center; display:flex; flex-direction:column; justify-content:center; font-size:15.5px; line-height:1.55; background:url(img/tc_l.png) left center/auto 100% no-repeat, url(img/tc_r.png) right center/auto 100% no-repeat, url(img/tc_m.png) center/calc(100% - 30px) 70% no-repeat; filter:drop-shadow(0 8px 18px rgba(0,0,0,.5)); }
#cut .scroll.edict h3 { font-size:18px; letter-spacing:.3em; margin:0 0 4px; }
#cut .scroll.edict .btns { justify-content:center; margin-top:8px; }
#musicbtn { position:fixed; right:10px; top:10px; z-index:6; background:var(--panel); color:var(--gold2); border:1px solid var(--line); border-radius:10px; padding:7px 12px; font-size:13px; cursor:pointer; }
#cut .scroll h3 { margin:0 0 4px; color:#8a1a17; font-size:17px; }
#cut .scroll .btns { justify-content:flex-end; }
#fade { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .6s; z-index:24; }
#decorbar { position:fixed; bottom:10px; left:50%; transform:translateX(-50%); display:flex; gap:6px; flex-wrap:wrap; justify-content:center; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:8px; z-index:7; max-width:94vw; }
#decorbar button { font-size:12px; padding:7px 9px; }
#decorbar button.on { border-color:var(--gold); background:rgba(160,90,30,.55); }
@media (max-width:760px) { #map { top:auto; bottom:200px; transform:none; } #map button { min-width:0; padding:7px 9px; font-size:12px; } #acts { top:auto; bottom:200px; transform:none; max-width:170px; } #who { min-width:0; } #stats .pill { font-size:11.5px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="fade"></div>

<div id="gate">
  <h1>MỘNG PHƯỢNG HOÀNG</h1>
  <div class="sub">Phượng khởi thâm cung</div>
  <div class="tag">“Một hậu cung, ngàn toan tính. Ai sẽ bước lên ngôi Hoàng hậu?”</div>
  <div class="card" id="loginCard">
    <h3>Vào cung</h3>
    <label>Tên đăng nhập</label><input id="lu" autocomplete="username">
    <label>Mật khẩu</label><input id="lp" type="password" autocomplete="current-password">
    <div class="row" style="margin-top:14px"><button class="gold" id="bLogin" style="flex:1">Đăng nhập</button><button id="bToReg" style="flex:1">Tiến cung (tạo mới)</button></div>
    <div id="err"></div>
  </div>
  <div class="card hidden" id="regCard" style="width:min(520px,94vw)">
    <h3>Tuyển tú</h3>
    <div class="row"><div style="flex:1"><label>Tên đăng nhập</label><input id="ru" autocomplete="username"></div><div style="flex:1"><label>Mật khẩu</label><input id="rp" type="password" autocomplete="new-password"></div></div>
    <label>Tên nhân vật (tên phong hiệu sau này)</label><input id="rn" maxlength="16" placeholder="Ví dụ: Thẩm My Trang">
    <label>Xuất thân</label><div class="choices" id="origins"></div>
    <label>Lối sống</label><div class="choices" id="paths"></div>
    <div class="row" style="margin-top:14px"><button id="bBack" style="flex:1">Quay lại</button><button class="gold" id="bReg" style="flex:2">Tiến cung</button></div>
    <div id="err2" style="color:#ffb4a0;font-size:13px;min-height:18px;margin-top:8px"></div>
  </div>
</div>

<div id="game" class="hidden">
  <div id="hud">
    <div id="who"><div class="nm" id="hName"></div><div class="rk" id="hRank"></div><div class="bar"><i id="hBar"></i></div><div style="font-size:11px;color:var(--muted);margin-top:3px" id="hPts"></div></div>
    <div id="stats"></div>
  </div>
  <div id="top5"><div class="t">🏆 Bảng xếp hạng hậu cung</div><ol id="top5list"></ol></div>
  <div id="map"></div>
  <div id="acts"></div>
  <div id="chat"><div id="chatlog"></div><input id="chatin" placeholder="Nói gì đó… (Enter để gửi)" maxlength="200"></div>
  <button id="newsbtn">📜 Bảng tin hậu cung</button>
  <div id="news" class="hidden"><h4>Bảng tin hậu cung</h4><div id="newslist"></div></div>
</div>
<div id="decorbar" class="hidden"></div>
<div id="toasts"></div>
<div id="cut" class="hidden"></div>
<div id="modal" class="modal hidden"><div class="card" id="mcard"></div></div>

<script src="/socket.io/socket.io.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module" src="js/game.js"></script>
</body>
</html>
